name: Publish conda packages
description: Publish .conda packages to the clice conda channel (https://conda.clice.io) through a pull request that merges itself

inputs:
  packages:
    description: Glob of the .conda files to publish, relative to the workspace
    required: true
  token:
    description: A token that can write to clice-io/conda (releases, branches, pull requests)
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v5
      with:
        node-version: 24
    - name: Checkout the channel
      uses: actions/checkout@v5
      with:
        repository: clice-io/conda
        token: ${{ inputs.token }}
        path: __conda_repo
    # The files go to their releases; their records to __conda_repo/index.
    - name: Upload
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: |
        shopt -s nullglob
        files=(${{ inputs.packages }})
        if (( ${#files[@]} == 0 )); then
          echo "::error::no file matches ${{ inputs.packages }}"
          exit 1
        fi
        node __conda_repo/scripts/publish.ts "${files[@]}"
    - name: Create pull request
      id: create-pr
      uses: peter-evans/create-pull-request@v7
      with:
        path: __conda_repo
        token: ${{ inputs.token }}
        # One branch per run: two runs, of one repository or of several, never
        # replace each other's records.
        branch: publish/${{ github.event.repository.name }}-${{ github.run_id }}-${{ github.run_attempt }}
        title: "publish: packages from ${{ github.repository }}"
        body: |
          Records of the packages published by [`${{ github.repository }}@${{ github.sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }}), run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}.
        commit-message: "publish: packages from ${{ github.repository }}"
        author: "clice-bot <306533837+clice-bot@users.noreply.github.com>"
        committer: "clice-bot <306533837+clice-bot@users.noreply.github.com>"
        delete-branch: true
    - name: Enable auto-merge
      if: steps.create-pr.outputs.pull-request-number
      shell: bash
      run: gh pr merge ${{ steps.create-pr.outputs.pull-request-number }} --auto --squash
      env:
        GH_TOKEN: ${{ inputs.token }}
        GH_REPO: clice-io/conda
